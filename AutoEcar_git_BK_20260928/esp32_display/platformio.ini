[platformio]
default_envs = display1

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main_old.cpp>

; ESP-HUB75 board: Flash 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv

lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.10
    adafruit/Adafruit GFX Library
    knolleary/PubSubClient@^2.8
    arduino-libraries/Ethernet@^2.0.2
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1


; =========================================================
; DISPLAY 1
; =========================================================

[env:display1]
extends = env
build_flags =
    ${env.build_flags}
    -DDISPLAY_ID=1

[env:display1_d34]
extends = env:display1
build_flags =
    ${env:display1.build_flags}
    -DHUB75_D_PIN=34

[env:display1_d33]
extends = env:display1
build_flags =
    ${env:display1.build_flags}
    -DHUB75_D_PIN=33

[env:display1_scan32]
extends = env:display1
build_flags =
    ${env:display1.build_flags}
    -DHUB75_SCAN_PROBE=32
    -DHUB75_SCAN_PIXEL_BASE=64

[env:display1_scan32_base32]
extends = env:display1
build_flags =
    ${env:display1.build_flags}
    -DHUB75_SCAN_PROBE=32
    -DHUB75_SCAN_PIXEL_BASE=32

[env:display1_scan16]
extends = env:display1
build_flags =
    ${env:display1.build_flags}
    -DHUB75_SCAN_PROBE=16
    -DHUB75_SCAN_PIXEL_BASE=64

[env:display1_scan64]
extends = env:display1
build_flags =
    ${env:display1.build_flags}
    -DHUB75_SCAN_PROBE=64
    -DHUB75_SCAN_PIXEL_BASE=64

[env:display1_scan40]
extends = env:display1
build_flags =
    ${env:display1.build_flags}
    -DHUB75_SCAN_PROBE=40
    -DHUB75_SCAN_PIXEL_BASE=64

; D1 symbols controlled by Pi/MQTT
[env:display1_symbols]
extends = env:display1
build_flags =
    ${env:display1.build_flags}
    -DDISPLAY_SYMBOL_MODE=1
    -DHUB75_SCAN_PROBE=32
    -DHUB75_SCAN_PIXEL_BASE=32

; D1 local bench
[env:display1_symbols_bench]
extends = env:display1_symbols
build_flags =
    ${env:display1_symbols.build_flags}
    -DSYMBOL_BENCH_TEST=1



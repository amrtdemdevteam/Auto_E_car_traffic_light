# E-Car Traffic Light MQTT broker listener.
# Bind only to the private traffic-light Ethernet address so MQTT is not
# exposed on maintenance Wi-Fi interfaces.
listener 1883 10.77.0.1
allow_anonymous true

# Persistence/logging are intentionally NOT repeated here. Debian Bookworm's
# /etc/mosquitto/mosquitto.conf already defines them; duplicating them causes
# Mosquitto to fail with "Duplicate persistence_location value".

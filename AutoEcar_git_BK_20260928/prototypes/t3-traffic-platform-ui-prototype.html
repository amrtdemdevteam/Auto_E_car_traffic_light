<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3 — Traffic Platform prototype</title>
<style>
:root{--paper:#f3f3ef;--white:#fff;--ink:#252923;--muted:#777d75;--line:#d9ddd5;--soft:#e9ece6;--green:#16865c;--green-bg:#e3f2e9;--blue:#426eaa;--blue-bg:#e9eef6;--gold:#9c7025;--gold-bg:#f4efe3;--red:#c93f47;--red-bg:#f8e8e7;--black:#0a0c0b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "Segoe UI",Arial,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
header{height:64px;background:#fbfbf9;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(calc((100vw - 1320px)/2),28px);gap:34px}
.logo{font-size:14px;font-weight:750;letter-spacing:.12em;white-space:nowrap}.logo span{font-weight:400;color:var(--muted);letter-spacing:.02em;margin-left:9px}.jpicker{border-left:1px solid var(--line);padding-left:25px;font-size:12px;color:#3e453e;white-space:nowrap}.jpicker b{font-weight:650}.jpicker i{font-style:normal;color:var(--muted);margin-left:10px}
nav{display:flex;align-self:stretch;gap:22px}nav button{border:0;background:none;padding:0 2px;color:#767d75;font-size:12px;border-bottom:2px solid transparent}nav button.active{color:var(--ink);border-color:var(--green);font-weight:650}
.head-right{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:11px;color:var(--muted);white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;background:#299363;border-radius:50%;margin-right:7px}
main{max-width:1320px;margin:auto;padding:31px 28px 110px}.topline{color:var(--muted);font-size:11px;margin-bottom:14px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:23px}.heading h1{font-size:25px;letter-spacing:-.035em;font-weight:600;margin:0}.heading p{color:var(--muted);font-size:12px;margin:6px 0 0}.actions{display:flex;align-items:center;gap:8px}.btn{border:1px solid #cdd2ca;background:transparent;border-radius:5px;padding:9px 13px;font-size:11px}.btn:hover{background:#fff}.btn.primary{background:#25362d;color:white;border-color:#25362d}
.meta{display:flex;align-items:center;gap:26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 2px;margin-bottom:18px;font-size:10px;color:var(--muted)}.meta b{color:#343a33;font-weight:600;margin-left:5px}
.layout{display:grid;grid-template-columns:minmax(540px,1.7fr) minmax(300px,.8fr);gap:23px}
.paper-panel{background:var(--white);border:1px solid var(--line);border-radius:3px}.panel-head{height:48px;padding:0 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head b{font-size:11px;font-weight:650}.panel-head span{font-size:10px;color:var(--muted)}
.map-area{height:440px;position:relative;overflow:hidden;background-color:#fbfbf9;background-image:linear-gradient(#e9ece7 1px,transparent 1px),linear-gradient(90deg,#e9ece7 1px,transparent 1px);background-size:52px 52px}
.cross{position:absolute;left:31%;right:27%;top:31%;bottom:26%;background:#e2e5e0;border:1px solid #c9cec7}
.cross:before{content:"";position:absolute;left:50%;top:-100px;bottom:-100px;border-left:1px dashed #b7beb5}.cross:after{content:"";position:absolute;top:50%;left:-120px;right:-120px;border-top:1px dashed #b7beb5}
.lane-node{position:absolute;width:117px;min-height:57px;background:#fff;border:1px solid #ccd2ca;border-radius:2px;padding:8px 10px;cursor:pointer;box-shadow:0 2px 5px #1f291509}.lane-node:hover,.lane-node.selected{border-color:#438a68;box-shadow:0 0 0 1px #438a68}.lane-node .name{font-weight:700;font-size:11px}.lane-node .sub{font-size:9px;color:var(--muted);margin-top:3px}.lane-node .arrow{float:right;font-size:17px;line-height:12px;color:var(--green);font-weight:600}.lane-node.manual .arrow{color:var(--blue)}.lane-node.special .arrow{color:var(--gold)}.c1{left:43%;top:4%}.c2{left:5%;top:42%}.c3{left:23%;bottom:5%}.c4{right:23%;bottom:5%}.c5{right:5%;top:42%}
.sensor{position:absolute;width:9px;height:9px;background:#303c35;border:2px solid white;box-shadow:0 0 0 1px #718076;border-radius:50%}.s1{left:49%;top:24%}.s1b{left:49%;top:31%}.s2{left:28%;top:51%}.s3{left:38%;bottom:20%;background:#bf8d36}.s4{right:38%;bottom:20%;background:#bf8d36}.s5{right:28%;top:51%}.pillar{position:absolute;right:3%;bottom:3%;border-left:5px solid #a69d68;padding:6px 0 6px 9px;color:#81794a;font-size:9px}.boxA{position:absolute;right:10%;bottom:11%;padding:6px 11px;border:1px solid #adb5aa;background:#fff;font-size:10px;font-weight:700}
.legend{display:flex;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.legend em{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.legend .a{background:#24845b}.legend .m{background:#426eaa}.legend .sp{background:#b48535}
.editor{padding:16px 18px}.editor h2{font-size:15px;font-weight:650;margin:0}.editor .sub{color:var(--muted);font-size:10px;margin-top:3px}.field{padding:13px 0;border-bottom:1px solid #e5e8e2}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:7px}.input{border:0;border-bottom:1px solid #cfd4cd;background:transparent;padding:4px 0 7px;width:100%;font-size:12px;outline:0}.input:focus{border-color:var(--green)}.select{border:0;background:transparent;padding:4px 0 7px;width:100%;font-size:12px;border-bottom:1px solid #cfd4cd}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}.inline-row{display:flex;justify-content:space-between;gap:12px;align-items:center}.small-note{font-size:9px;color:var(--muted);line-height:1.5}.rule{font-size:10px;padding:12px 0;border-bottom:1px solid #e5e8e2}.rule b{display:block;color:#343a33;font-weight:600;margin-bottom:3px}.rule span{color:var(--muted)}
.route-table{width:100%;border-collapse:collapse;background:#fff}.route-table th{text-align:left;font-size:9px;color:var(--muted);font-weight:550;padding:10px 13px;border-bottom:1px solid var(--line)}.route-table td{padding:12px 13px;border-bottom:1px solid #e7e9e4;font-size:11px}.route-table tr{cursor:pointer}.route-table tbody tr:hover,.route-table tbody tr.selected{background:#f3f7f2}.laneid{font-weight:700}.tag{font-size:9px;color:var(--muted)}
.config-cols{display:grid;grid-template-columns:1fr 1fr;gap:27px}.config-group{background:#fff;border-top:1px solid #abb3a9}.config-group h2{font-size:12px;margin:0;padding:13px 0;border-bottom:1px solid var(--line)}.config-row{display:grid;grid-template-columns:1fr 100px;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid #e1e4de}.config-row b{font-weight:600;font-size:11px}.config-row small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.config-row input{width:100%;border:1px solid #cfd4cc;border-radius:3px;padding:7px;font-size:11px;background:#fcfcfa}
.led{width:100%;aspect-ratio:2/1;background:#050706;border:4px solid #272b28;display:block}.led svg{width:100%;height:100%;display:block}.preview{background:#fff;padding:16px;display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:center;border:1px solid var(--line)}.preview .led{width:100%}.preview h3{font-size:13px;margin:0}.preview p{font-size:10px;color:var(--muted);margin:5px 0 0}
.frames-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 11px}.filters{display:flex;gap:5px}.filters button{background:transparent;border:1px solid #cfd4cd;padding:6px 10px;font-size:10px}.filters button.active{background:#29362e;border-color:#29362e;color:white}.frames-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));border-top:1px solid #cfd4cd;border-left:1px solid #cfd4cd;background:#fff}.frame{padding:13px;border-right:1px solid #cfd4cd;border-bottom:1px solid #cfd4cd;cursor:pointer}.frame:hover,.frame.selected{background:#f4f7f3;box-shadow:inset 0 0 0 1px #508460}.frame .led{border-width:3px}.frame-title{display:flex;justify-content:space-between;gap:5px;margin-top:8px}.frame-title b{font-size:10px;font-weight:650}.frame-title small{font-size:9px;color:var(--muted)}.frame-desc{font-size:9px;color:var(--muted);margin-top:3px}.reserve{color:#82723d!important}
.switcher{position:fixed;z-index:5;bottom:15px;left:50%;transform:translateX(-50%);background:#252c26;color:#fff;display:flex;align-items:center;gap:3px;padding:4px;border-radius:3px;box-shadow:0 4px 18px #0002}.switcher span{font-size:8px;letter-spacing:.13em;color:#bdc3bb;padding:0 9px}.switcher button{border:0;background:transparent;color:#c7cec6;padding:8px 10px;font-size:9px;border-radius:2px}.switcher button.active{background:#65746a;color:#fff}
@media(max-width:980px){header{padding:0 20px;gap:15px}.jpicker{padding-left:13px}nav{gap:12px}.layout{grid-template-columns:1fr}.config-cols{grid-template-columns:1fr 1fr}.frames-grid{grid-template-columns:repeat(3,minmax(145px,1fr))}}
@media(max-width:650px){header{height:auto;min-height:59px;flex-wrap:wrap;padding:10px 14px;gap:10px}.logo span,.head-right{display:none}.jpicker{margin-left:auto;border:0;padding:0}nav{order:3;width:100%;height:34px;justify-content:space-around}main{padding:21px 13px 90px}.heading{align-items:flex-start;flex-direction:column}.meta{gap:10px;flex-wrap:wrap}.map-area{height:350px}.map-area{background-size:36px 36px}.lane-node{width:92px;padding:7px}.lane-node .sub{font-size:8px}.frames-grid{grid-template-columns:repeat(2,minmax(125px,1fr))}.preview{grid-template-columns:1fr}.preview .led{max-width:280px}.config-cols{grid-template-columns:1fr}.switcher span{display:none}.switcher button{padding:8px}}
</style></head><body><div id="app"></div>
<script>
const laneData=[
{id:"C1",name:"Auto E-Car",kind:"AUTO",display:"B4",sensor:"2 จุด · ไกล + ใกล้แยก",timing:"4 วิ",style:"auto",dir:"up"},
{id:"C2",name:"Manual",kind:"MANUAL",display:"B1",sensor:"1 จุด · ใกล้แยก",timing:"3 วิ",style:"manual",dir:"up"},
{id:"C3",name:"Manual พิเศษ",kind:"HAND",display:"B2",sensor:"Mini Plus · ข้างเลน",timing:"มือ 3 วิ / เขียว 6 วิ",style:"special",dir:"up"},
{id:"C4",name:"Manual พิเศษ",kind:"HAND",display:"B5",sensor:"Mini Plus · ข้างเลน",timing:"มือ 3 วิ / เขียว 6 วิ",style:"special",dir:"up"},
{id:"C5",name:"Manual",kind:"MANUAL",display:"B3",sensor:"1 จุด · ใกล้แยก",timing:"3 วิ",style:"manual",dir:"up"}
];
const frameData=[
{id:"boot-a",name:"เริ่มระบบ · 1",group:"start",desc:"เปิดจอและเริ่มต้น controller"},
{id:"boot-b",name:"เริ่มระบบ · 2",group:"start",desc:"สถานะกำลังโหลด config"},
{id:"boot-c",name:"พร้อมทำงาน",group:"start",desc:"เริ่มควบคุมเมื่อรับ config ครบ"},
{id:"idle",name:"ไม่มีรถ",group:"traffic",desc:"กากบาทแดงแสดงทุกจอ"},
{id:"arrow-up",name:"ลูกศรขึ้น",group:"traffic",desc:"ทิศตรง · เฟรมหลัก"},
{id:"arrow-down",name:"ลูกศรลง",group:"traffic",desc:"ทิศกลับสำหรับ config"},
{id:"arrow-left",name:"ลูกศรซ้าย",group:"traffic",desc:"ทิศเลี้ยวสำหรับ config"},
{id:"arrow-right",name:"ลูกศรขวา",group:"traffic",desc:"ทิศเลี้ยวสำหรับ config"},
{id:"clear-3",name:"ท้ายรถพ้น · 3",group:"count",desc:"เริ่มนับหลังเซนเซอร์ไม่พบรถ"},
{id:"clear-2",name:"ท้ายรถพ้น · 2",group:"count",desc:"นับเวลาหน่วง"},
{id:"clear-1",name:"ท้ายรถพ้น · 1",group:"count",desc:"พร้อมสลับสิทธิ์เลน"},
{id:"sense-1",name:"ตรวจมือ · 1/3",group:"hand",desc:"คลื่นเซนเซอร์เริ่มทำงาน"},
{id:"sense-2",name:"ตรวจมือ · 2/3",group:"hand",desc:"แสดงว่ากำลังตรวจพบต่อเนื่อง"},
{id:"sense-3",name:"ตรวจมือ · 3/3",group:"hand",desc:"ครบเวลาค้างก่อนให้เขียว"},
{id:"sense-ok",name:"ทริกเกอร์รับแล้ว",group:"hand",desc:"วงเป้าหมาย + เครื่องหมายยืนยัน"},
{id:"go-6",name:"ไฟเขียว · 6",group:"count",desc:"เวลาเขียวเลนพิเศษ"},
{id:"go-5",name:"ไฟเขียว · 5",group:"count",desc:"นับเวลาคงเหลือ"},
{id:"go-4",name:"ไฟเขียว · 4",group:"count",desc:"นับเวลาคงเหลือ"},
{id:"go-3",name:"ไฟเขียว · 3",group:"count",desc:"นับเวลาคงเหลือ"},
{id:"go-2",name:"ไฟเขียว · 2",group:"count",desc:"นับเวลาคงเหลือ"},
{id:"go-1",name:"ไฟเขียว · 1",group:"count",desc:"วินาทีสุดท้าย"},
{id:"sensor-error",name:"เซนเซอร์ขัดข้อง",group:"fault",desc:"แจ้งหมายเลขเซนเซอร์/เลน"},
{id:"link-lost",name:"ขาดการเชื่อมต่อ",group:"fault",desc:"จอไม่ได้รับคำสั่งจาก controller"},
{id:"reconnect",name:"กำลังเชื่อมต่อใหม่",group:"fault",desc:"รอ controller กลับมา"},
{id:"yellow-optional",name:"สามเหลี่ยมเหลือง",group:"reserve",desc:"เฟรมสำรอง · ปิดไว้โดยค่าเริ่มต้น"},
{id:"config-error",name:"ตั้งค่าไม่ครบ",group:"fault",desc:"ยังไม่เริ่มแสดงไฟเขียว"}
];
let variant=new URLSearchParams(location.search).get("variant")||"map",page=new URLSearchParams(location.search).get("page")||"lanes",selectedLane="C3",selectedFrame="idle",filter="all";
const colors={green:"#39df86",blue:"#79aefb",white:"#f1f3ee",red:"#f3444b",gold:"#f0b951",cyan:"#76d9d2"};
function setUrl(){let p=new URLSearchParams(location.search);p.set("variant",variant);p.set("page",page);history.replaceState({},"",location.pathname+"?"+p)}
function arrow(dir,col){let d={up:"M32 2 10 23h13v8h18v-8h13z",down:"M23 1h18v8h13L32 31 10 9h13z",left:"M4 16 27 1v11h25v9H27v11z",right:"M60 16 37 1v11H12v9h25v11z"};return '<path fill="'+col+'" d="'+d[dir]+'"/>'}
function symbol(id){
let s='<svg viewBox="0 0 64 32" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="32" fill="#050706"/>';
if(id==="idle")s+='<path d="M19 4 11 12l17 17 7-7L19 4Zm26 0L28 21l7 8 18-17-8-8Z" fill="'+colors.red+'"/>';
else if(id.startsWith("arrow-"))s+=arrow(id.slice(6),colors.green);
else if(id.startsWith("clear-"))s+='<path d="M31 3 17 17h9v11h12V17h9z" fill="'+colors.red+'"/>'+num(id.slice(6),colors.white,49,25,18);
else if(id.startsWith("sense-")){let stage=id==="sense-ok"?3:Number(id.slice(6));s+='<circle cx="21" cy="16" r="4" fill="none" stroke="'+colors.cyan+'" stroke-width="2"/><circle cx="21" cy="16" r="'+(7+stage*3)+'" fill="none" stroke="'+colors.cyan+'" stroke-width="1.4" opacity="'+(.55+stage*.12)+'"/><path d="M9 5 2 16l7 11M33 5l7 11-7 11" fill="none" stroke="'+colors.cyan+'" stroke-width="1.5"/>'+num(String(stage),colors.white,50,24,18)+'<text x="51" y="30" fill="'+colors.cyan+'" text-anchor="middle" font-size="6">/3</text>';if(id==="sense-ok")s+='<path d="m45 7 3 3 6-7" fill="none" stroke="'+colors.green+'" stroke-width="2"/>'}
else if(id.startsWith("go-"))s+=arrow("up",colors.green)+num(id.slice(3),colors.white,52,24,19);
else if(id==="sensor-error")s+='<path d="M5 4h13v24H5z" fill="none" stroke="'+colors.red+'" stroke-width="2"/><path d="M8 7 15 25M15 7 8 25" stroke="'+colors.red+'" stroke-width="2"/><text x="42" y="13" fill="#fff" font-family="Arial" font-size="6" text-anchor="middle">SENSOR 1</text><text x="42" y="23" fill="'+colors.red+'" font-family="Arial" font-weight="700" font-size="8" text-anchor="middle">BROKEN</text>';
else if(id==="link-lost")s+='<path d="M8 11a9 9 0 0 1 15-5l3 3M23 5l1 5-5-1M56 21a9 9 0 0 1-15 5l-3-3m3 3-1-5 5 1" fill="none" stroke="'+colors.red+'" stroke-width="2"/><text x="32" y="19" fill="#f1f3ee" font-family="Arial" font-weight="700" font-size="7" text-anchor="middle">LINK LOST</text>';
else if(id==="reconnect")s+='<path d="M13 11a11 11 0 0 1 19-6l3 4M35 4l1 6-6-1M51 21a11 11 0 0 1-19 6l-3-4m3 4-1-6 6 1" fill="none" stroke="'+colors.cyan+'" stroke-width="2"/><text x="32" y="19" fill="#f1f3ee" font-family="Arial" font-size="6" text-anchor="middle">RECONNECT</text>';
else if(id==="yellow-optional")s+='<path d="M32 3 8 28h48z" fill="'+colors.gold+'"/>';
else if(id==="config-error")s+='<path d="M8 4h48v24H8z" fill="none" stroke="'+colors.red+'" stroke-width="1.5"/><text x="32" y="15" fill="#fff" font-family="Arial" font-size="6" text-anchor="middle">CONFIG</text><text x="32" y="23" fill="'+colors.red+'" font-family="Arial" font-size="7" font-weight="700" text-anchor="middle">CHECK</text>';
else {s+='<circle cx="32" cy="16" r="9" fill="none" stroke="'+colors.green+'" stroke-width="2"/><text x="32" y="19" fill="'+colors.green+'" font-family="Arial" font-weight="700" font-size="8" text-anchor="middle">T3</text><text x="32" y="30" fill="#fff" font-family="Arial" font-size="5" text-anchor="middle">'+(id==="boot-a"?"STARTING":id==="boot-b"?"LOAD CONFIG":"READY")+'</text>';let dots=id==="boot-a"?1:id==="boot-b"?2:3;for(let i=0;i<3;i++)s+='<circle cx="'+(27+i*5)+'" cy="25" r="1" fill="'+(i<dots?colors.green:"#465149")+'"/>'}
return s+'</svg>';
}
function num(n,col,x,y,size){return '<text x="'+x+'" y="'+y+'" text-anchor="middle" fill="'+col+'" font-family="Arial,sans-serif" font-size="'+size+'" font-weight="800">'+n+'</text>'}
function header(){return '<header><div class="logo">T3 <span>traffic platform</span></div><div class="jpicker"><b>T3 · จุดตัดคลังสินค้า</b><i>⌄</i></div><nav><button data-page="lanes" class="'+(page==="lanes"?'active':'')+'">ผังเลน</button><button data-page="config" class="'+(page==="config"?'active':'')+'">การทำงาน</button><button data-page="frames" class="'+(page==="frames"?'active':'')+'">เฟรมจอ</button><button data-page="sensors" class="'+(page==="sensors"?'active':'')+'">เซนเซอร์</button></nav><div class="head-right"><span><i class="dot"></i>Controller online</span><span>Raspberry Pi 4B</span></div></header>'}
function title(h,sub,btn){return '<div class="topline">แยก / T3</div><div class="heading"><div><h1>'+h+'</h1><p>'+sub+'</p></div>'+(btn||'')+'</div>'}
function meta(){return '<div class="meta"><span>เลน <b>5</b></span><span>จอ <b>B1–B5</b></span><span>จุดเซนเซอร์ <b>6</b></span><span>ไม่มีรถ <b style="color:#b9343b">X แดงทุกจอ</b></span></div>'}
function laneLabel(l,cls,pos){return '<div class="lane-node '+cls+' '+pos+' '+(selectedLane===l.id?'selected':'')+'" data-lane="'+l.id+'"><span class="arrow">'+(l.dir==="up"?"↑":"↑")+'</span><div class="name">'+l.id+' · '+(l.style==="auto"?"AUTO":l.style==="special"?"HAND":"MANUAL")+'</div><div class="sub">จอ '+l.display+'</div></div>'}
function map(){return '<div class="map-area"><div class="cross"></div>'+laneLabel(laneData[0],"auto","c1")+laneLabel(laneData[1],"manual","c2")+laneLabel(laneData[2],"special","c3")+laneLabel(laneData[3],"special","c4")+laneLabel(laneData[4],"manual","c5")+'<i class="sensor s1"></i><i class="sensor s1b"></i><i class="sensor s2"></i><i class="sensor s3"></i><i class="sensor s4"></i><i class="sensor s5"></i><div class="pillar">PILLAR</div><div class="boxA">A · Controller</div></div><div class="legend"><span><em class="a"></em>Auto</span><span><em class="m"></em>Manual</span><span><em class="sp"></em>Manual พิเศษ</span><span>คลิกเลนเพื่อแก้ไข</span></div>'}
function editor(){let l=laneData.find(x=>x.id===selectedLane)||laneData[2],sp=l.style==="special";return '<section class="paper-panel"><div class="panel-head"><b>รายละเอียดเลน</b><span>แก้ไขเฉพาะ T3</span></div><div class="editor"><h2>'+l.id+' · '+l.name+'</h2><div class="sub">กำหนดเลน เซนเซอร์ และจอ</div><div class="field"><label>ประเภทเลน</label><select class="select"><option>'+l.kind+'</option><option>AUTO</option><option>MANUAL</option><option>HAND TRIGGER</option></select></div><div class="twocol"><div class="field"><label>จอ</label><select class="select"><option>'+l.display+'</option><option>B1</option><option>B2</option><option>B3</option><option>B4</option><option>B5</option></select></div><div class="field"><label>ลูกศร</label><select class="select"><option>↑ ขึ้น</option><option>↓ ลง</option><option>← ซ้าย</option><option>→ ขวา</option></select></div></div><div class="field"><label>เซนเซอร์</label><select class="select"><option>'+(sp?'Mini Plus · ข้างเลน / ตรวจมือ':l.style==="auto"?'2 จุด · ไกลและใกล้แยก':'1 จุด · ใกล้แยก')+'</option></select></div><div class="twocol"><div class="field"><label>'+(sp?'ค้างมือเพื่อทริก':'Clear delay')+'</label><input class="input" value="'+(sp?'3':'3')+' วินาที"></div><div class="field"><label>เวลาไฟเขียว</label><input class="input" value="'+(sp?'6':'ตามโหมด')+' '+(sp?'วินาที':'')+'"></div></div><div class="rule"><b>สิทธิ์เลน</b><span>'+(l.style==="auto"?'Auto priority · มีเซนเซอร์ 2 จุด':'Manual · ทำงานตามลำดับการตรวจพบ')+'</span></div><div class="small-note" style="padding-top:13px">เซนเซอร์เสียจะพักเฉพาะเลน '+l.id+' จอของเลนนั้นแจ้งปัญหา เลนอื่นทำงานต่อ</div></div></section>'}
function opsView(){let rows=laneData.map(l=>'<tr data-lane="'+l.id+'" class="'+(selectedLane===l.id?'selected':'')+'"><td class="laneid">'+l.id+'</td><td>'+l.name+'</td><td><span class="tag">'+l.sensor+'</span></td><td>'+l.display+'</td><td>'+l.timing+'</td></tr>').join("");return title("เลนและจอ","ตั้งค่าจุดตัดและการจับคู่อุปกรณ์",'<div class="actions"><button class="btn">คัดลอก config</button><button class="btn primary">บันทึกการตั้งค่า</button></div>')+meta()+'<div class="layout"><section class="paper-panel"><div class="panel-head"><b>การจับคู่เลน</b><span>เลือกแถวเพื่อแก้รายละเอียด</span></div><table class="route-table"><thead><tr><th>เลน</th><th>รูปแบบ</th><th>เซนเซอร์</th><th>จอ</th><th>เวลาเริ่มต้น</th></tr></thead><tbody>'+rows+'</tbody></table></section>'+editor()+'</div>'}
function mapView(){return title("T3 · ผังทางแยก","จัดวางเลนและผูกจอให้ตรงกับหน้างาน",'<div class="actions"><button class="btn">ดูเฟรม</button><button class="btn primary">บันทึก config</button></div>')+meta()+'<div class="layout"><section class="paper-panel"><div class="panel-head"><b>ผังเลน</b><span>สเก็ตช์ประกอบการตั้งค่า</span></div>'+map()+'</section>'+editor()+'</div><section class="paper-panel" style="margin-top:15px"><table class="route-table"><thead><tr><th>เลน</th><th>ชนิด</th><th>เซนเซอร์</th><th>จอ</th><th>เวลาตั้งต้น</th></tr></thead><tbody>'+laneData.map(l=>'<tr data-lane="'+l.id+'" class="'+(selectedLane===l.id?'selected':'')+'"><td class="laneid">'+l.id+'</td><td>'+l.name+'</td><td>'+l.sensor+'</td><td>'+l.display+'</td><td>'+l.timing+'</td></tr>').join("")+'</tbody></table></section>'}
function configView(){return title("การทำงาน","ปรับพารามิเตอร์ของ T3 โดยไม่แก้โค้ด",'<div class="actions"><button class="btn">คืนค่าเริ่มต้น</button><button class="btn primary">บันทึก config</button></div>')+meta()+'<div class="config-cols"><section class="config-group"><h2>กติกาเลน</h2><div class="config-row"><div><b>สิทธิ์ Auto C1</b><small>ให้สิทธิ์ Auto ก่อนเมื่อแยกว่าง</small></div><select><option>เปิด</option></select></div><div class="config-row"><div><b>Manual clear delay</b><small>เริ่มนับหลังท้ายรถพ้นเซนเซอร์</small></div><input value="3 วินาที"></div><div class="config-row"><div><b>Auto clear delay</b><small>เริ่มนับหลังท้าย dolly พ้นเซนเซอร์ใกล้แยก</small></div><input value="4 วินาที"></div><div class="config-row"><div><b>ไม่มีรถในทุกเลน</b><small>สถานะเริ่มต้นของจอทุกจอ</small></div><select><option>X แดง</option></select></div></section><section class="config-group"><h2>เลนพิเศษ C3 / C4</h2><div class="config-row"><div><b>เวลาค้างมือ</b><small>ต้องตรวจพบต่อเนื่องจึงรับคำสั่ง</small></div><input value="3 วินาที"></div><div class="config-row"><div><b>เวลาไฟเขียว</b><small>นับถอยหลังหลังยืนยันคำสั่ง</small></div><input value="6 วินาที"></div><div class="config-row"><div><b>สถานะระหว่างตรวจมือ</b><small>คลื่นเป้าสัญญาณและตัวนับ 1/3</small></div><select><option>Target pulse</option></select></div><div class="config-row"><div><b>เซนเซอร์เสีย</b><small>พักเฉพาะเลนและแจ้งที่จอนั้น</small></div><select><option>Lane only</option></select></div></section></div>'}
function frameCard(f){return '<article data-frame="'+f.id+'" class="frame '+(selectedFrame===f.id?'selected':'')+'"><div class="led">'+symbol(f.id)+'</div><div class="frame-title"><b>'+f.name+'</b><small class="'+(f.group==="reserve"?'reserve':'')+'">'+(f.group==="reserve"?'สำรอง':f.group==="start"?'เริ่มระบบ':f.group==="hand"?'C3 / C4':f.group==="fault"?'แจ้งสถานะ':f.group==="count"?'นับเวลา':'เลน')+'</small></div><div class="frame-desc">'+f.desc+'</div></article>'}
function framesView(){let list=frameData.filter(f=>filter==="all"||f.group===filter),f=frameData.find(x=>x.id===selectedFrame)||frameData[3];return title("เฟรมจอ","ชุดเฟรมเก็บใน ESP32 · HUB75 64 × 32",'<div class="actions"><button class="btn primary">ใช้ config นี้</button></div>')+'<div class="preview"><div class="led">'+symbol(f.id)+'</div><div><h3>'+f.name+'</h3><p>'+f.desc+'</p><p>หน้าจอจำลองตามสัดส่วน panel 64 × 32</p></div></div><div class="frames-head"><div class="filters">'+[['all','ทั้งหมด'],['start','เปิดเครื่อง'],['traffic','เลน'],['hand','ตรวจมือ'],['count','นับเวลา'],['fault','สถานะ'],['reserve','สำรอง']].map(x=>'<button data-filter="'+x[0]+'" class="'+(filter===x[0]?'active':'')+'">'+x[1]+'</button>').join("")+'</div><span class="small-note">26 แบบ · ตัวเลขเป็น glyph ใช้ร่วมกัน</span></div><div class="frames-grid">'+list.map(frameCard).join("")+'</div><p class="small-note" style="margin-top:13px">เก็บเป็นภาพสัญลักษณ์/ตัวเลขใน flash แล้วประกอบเฟรมตาม config ไม่ต้องบันทึกภาพเต็มจอซ้ำทุกวินาที · สามเหลี่ยมเหลืองปิดไว้เป็นเฟรมสำรอง</p>'}
function sensorsView(){return title("เซนเซอร์","สถานะและการผูกอุปกรณ์กับแต่ละเลน",'<div class="actions"><button class="btn primary">บันทึก config</button></div>')+meta()+'<section class="paper-panel"><table class="route-table"><thead><tr><th>เลน</th><th>ตำแหน่ง / บทบาท</th><th>จำนวน</th><th>สถานะตัวอย่าง</th><th>หากขัดข้อง</th></tr></thead><tbody>'+laneData.map(l=>'<tr data-lane="'+l.id+'"><td class="laneid">'+l.id+'</td><td>'+l.sensor+'</td><td>'+(l.style==="auto"?'2':'1')+'</td><td><span style="color:#16865c">ปกติ</span></td><td>พักเฉพาะ '+l.id+' · จอ '+l.display+' แจ้งเซนเซอร์เสีย</td></tr>').join("")+'</tbody></table></section>'}
function view(){if(page==="frames")return framesView();if(page==="config")return configView();if(page==="sensors")return sensorsView();return variant==="ops"?opsView():variant==="config"?configView():mapView()}
function render(){document.getElementById("app").innerHTML=header()+'<main>'+view()+'</main><div class="switcher"><span>LAYOUT</span><button data-variant="ops" class="'+(variant==="ops"?'active':'')+'">A · Table</button><button data-variant="map" class="'+(variant==="map"?'active':'')+'">B · Map</button><button data-variant="config" class="'+(variant==="config"?'active':'')+'">C · Parameters</button></div>';bind()}
function bind(){document.querySelectorAll("[data-page]").forEach(x=>x.onclick=()=>{page=x.dataset.page;setUrl();render()});document.querySelectorAll("[data-variant]").forEach(x=>x.onclick=()=>{variant=x.dataset.variant;setUrl();render()});document.querySelectorAll("[data-lane]").forEach(x=>x.onclick=()=>{selectedLane=x.dataset.lane;render()});document.querySelectorAll("[data-frame]").forEach(x=>x.onclick=()=>{selectedFrame=x.dataset.frame;render()});document.querySelectorAll("[data-filter]").forEach(x=>x.onclick=()=>{filter=x.dataset.filter;render()})}
render();
</script></body></html>

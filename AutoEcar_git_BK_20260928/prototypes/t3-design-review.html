<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3 · Design Review</title>
<style>
:root{--paper:#f5f5f1;--surface:#fff;--ink:#202620;--muted:#737a72;--line:#d9ddd5;--green:#16895b;--blue:#477aa7;--cyan:#149da4;--red:#cf3d43;--gold:#b68b38;--soft:#eef0eb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.45 "IBM Plex Sans Thai","Segoe UI",Arial,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
header{height:62px;display:flex;align-items:center;gap:25px;padding:0 max(28px,calc((100vw - 1440px)/2));background:#fbfbf9;border-bottom:1px solid var(--line)}
.brand{font-size:12px;font-weight:800;letter-spacing:.15em;white-space:nowrap}.brand small{font-weight:400;color:var(--muted);letter-spacing:0;margin-left:8px;font-size:11px}
.junction{padding-left:20px;border-left:1px solid var(--line);font-size:11px;white-space:nowrap}.junction b{font-weight:650}
nav{height:100%;display:flex;gap:23px}nav button{border:0;background:none;border-bottom:2px solid transparent;padding:0 2px;color:var(--muted);font-size:10px;white-space:nowrap}nav button.on{color:var(--ink);border-color:#242b24;font-weight:650}
.topstatus{margin-left:auto;display:flex;gap:19px;align-items:center;color:var(--muted);font-size:9px;white-space:nowrap}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#229461;margin-right:6px}
main{max-width:1440px;margin:auto;padding:25px 30px 92px}.kicker{font-size:9px;color:var(--muted);margin-bottom:8px}.title{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}.title h1{font-size:22px;line-height:1.2;letter-spacing:-.03em;margin:0;font-weight:630}.title p{margin:6px 0 0;color:var(--muted);font-size:10px}.actions{display:flex;gap:7px}.btn{background:transparent;border:1px solid #cdd2ca;padding:7px 11px;font-size:9px;border-radius:3px}.btn:hover{background:#fff}.btn.dark{background:#26352c;color:#fff;border-color:#26352c}
.meta{display:flex;gap:24px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 2px;margin-bottom:15px;color:var(--muted);font-size:9px}.meta b{color:#343a33;margin-left:4px;font-weight:650}.meta .idle{color:#bd3137}
.panel{background:var(--surface);border:1px solid var(--line)}.ph{height:39px;padding:0 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.ph b{font-weight:650;font-size:10px}.ph span{font-size:8px;color:var(--muted)}
.overview{display:grid;grid-template-columns:190px minmax(400px,1fr) minmax(380px,1.08fr);gap:12px}.junction-list{padding:11px}.jitem{padding:10px 8px;border-bottom:1px solid #e8eae6;cursor:pointer}.jitem.active{background:#f0f2ed;border-left:2px solid #4d6d55;padding-left:6px}.jitem b{font-size:10px;display:block}.jitem small{font-size:8px;color:var(--muted)}
.map{height:325px;position:relative;background:#fafbf8;background-image:linear-gradient(#eceee9 1px,transparent 1px),linear-gradient(90deg,#eceee9 1px,transparent 1px);background-size:36px 36px}
.road{position:absolute;left:31%;right:29%;top:31%;bottom:28%;background:#e5e7e2;border:1px solid #ccd1c8}.road:before{content:"";position:absolute;left:50%;top:-90px;bottom:-90px;border-left:1px dashed #b4bbb1}.road:after{content:"";position:absolute;left:-100px;right:-100px;top:50%;border-top:1px dashed #b4bbb1}
.lane{position:absolute;width:78px;min-height:50px;border:1px solid #cbd1c8;background:#fff;padding:5px 6px;cursor:pointer}.lane:hover,.lane.sel{border-color:#5b8264;box-shadow:0 0 0 1px #5b8264}.lane b{font-size:9px}.lane small{display:block;color:var(--muted);font-size:7px}.lane i{float:right;font-style:normal;font-size:15px;color:var(--green);line-height:13px}.lane.manual i{color:var(--blue)}.lane.special i{color:var(--gold)}
.ln1{top:3%;left:43%}.ln2{left:2%;top:42%}.ln3{bottom:3%;left:22%}.ln4{bottom:3%;right:22%}.ln5{right:2%;top:42%}
.sdot{position:absolute;width:7px;height:7px;border:2px solid white;box-shadow:0 0 0 1px #526257;border-radius:50%;background:#34453a}.sd1{left:48%;top:23%}.sd1b{left:48%;top:30%}.sd2{left:26%;top:50%}.sd3{left:37%;bottom:19%;background:#b68b38}.sd4{right:37%;bottom:19%;background:#b68b38}.sd5{right:26%;top:50%}.pillar{position:absolute;right:2%;bottom:3%;border-left:4px solid #a49b64;color:#867f4c;font-size:7px;padding:4px}.boxa{position:absolute;right:9%;bottom:10%;font-size:8px;border:1px solid #b8beb5;background:white;padding:4px 6px}
.mapfoot{padding:8px 10px;border-top:1px solid var(--line);font-size:8px;color:var(--muted);display:flex;gap:12px}.mapfoot i{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
.status-table{width:100%;border-collapse:collapse}.status-table th{text-align:left;color:var(--muted);font-size:8px;font-weight:500;padding:8px 8px;border-bottom:1px solid var(--line)}.status-table td{padding:8px;border-bottom:1px solid #e8eae6;font-size:9px}.status-table tr:last-child td{border-bottom:0}.status-table tr:hover{background:#f6f7f4}.sid{font-weight:700}.muted{color:var(--muted)}.stgreen{color:var(--green)}.stred{color:var(--red)}.stblue{color:var(--blue)}.screen{width:61px;height:31px;background:#050706;display:grid;place-items:center;border:1px solid #252925}.screen svg{width:100%;height:100%}
.sim{margin-top:12px;padding:10px 12px;background:#fff;border:1px solid var(--line)}.simhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.simhead b{font-size:9px}.simhead span{font-size:8px;color:var(--muted)}.scenarios{display:flex;flex-wrap:wrap;gap:5px}.scenarios button{font-size:8px;background:#fff;border:1px solid #d2d7cf;padding:5px 8px;border-radius:2px}.scenarios button.active{background:#29372e;color:white;border-color:#29372e}
.two{display:grid;grid-template-columns:minmax(420px,1.05fr) minmax(440px,.95fr);gap:13px}.map.big{height:470px}.mapping{width:100%;border-collapse:collapse}.mapping th,.mapping td{text-align:left;padding:9px 8px;border-bottom:1px solid #e7eae4;font-size:9px}.mapping th{color:var(--muted);font-weight:500;font-size:8px}.mapping td:first-child{font-weight:700}.mapping tr.sel{background:#f2f5f0}
.editor{padding:13px}.editor h2{font-size:13px;margin:0 0 3px}.editor>p{font-size:9px;color:var(--muted);margin:0 0 10px}.field{padding:9px 0;border-bottom:1px solid #e6e9e3}.field label{display:block;color:var(--muted);font-size:8px;margin-bottom:4px}.field input,.field select{width:100%;border:0;border-bottom:1px solid #ccd2ca;background:transparent;padding:4px 0;font-size:10px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.notice{margin-top:10px;padding:9px;border-left:2px solid #6c886e;background:#f2f5f0;color:#556558;font-size:8px;line-height:1.5}
.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.rule-group h2{font-size:11px;font-weight:650;border-bottom:1px solid #aeb6ac;padding:9px 0;margin:0}.rule{padding:10px 2px;border-bottom:1px solid #e0e4dc;display:grid;grid-template-columns:1fr 125px;gap:10px;align-items:center}.rule b{font-size:9px;font-weight:600}.rule small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.rule input,.rule select{background:#fff;border:1px solid #ccd2ca;border-radius:2px;padding:6px;font-size:9px}.rules-note{margin-top:14px;border-top:1px solid var(--line);padding-top:11px;font-size:9px;color:#555e55}
.frames-layout{display:grid;grid-template-columns:minmax(550px,1fr) 305px;gap:14px}.frame-tabs{display:flex;gap:5px}.frame-tabs button{border:1px solid #d0d5cd;background:white;padding:5px 8px;font-size:8px}.frame-tabs button.on{background:#26352c;color:white;border-color:#26352c}
.frame-grid{display:grid;grid-template-columns:repeat(5,minmax(93px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:white}.fc{padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}.fc:hover,.fc.sel{background:#f2f4ef;box-shadow:inset 0 0 0 1px #596d5b}.fc .screen{width:100%;height:auto;aspect-ratio:2/1;border:2px solid #242824}.fc .lab{display:flex;justify-content:space-between;align-items:center;margin-top:5px}.fc b{font-size:8px;font-weight:650}.fc small{font-size:7px;color:var(--muted)}.fc .onstate{color:var(--green)}.fc .reserved{color:#9b7939}
.large-screen{padding:14px;background:#fff}.large-screen .screen{width:100%;height:auto;aspect-ratio:2/1;border:8px solid #242824}.large-screen h2{font-size:11px;margin:11px 0 3px}.large-screen p{font-size:8px;color:var(--muted);margin:0}.details{margin-top:11px;border-top:1px solid var(--line);padding-top:8px;font-size:8px;color:var(--muted);line-height:1.6}.measure{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:9px;padding-top:8px;font-size:8px}
.modebar{position:fixed;bottom:13px;left:50%;transform:translateX(-50%);z-index:4;background:#26352c;color:white;padding:4px;display:flex;gap:3px;box-shadow:0 3px 14px #1720172b}.modebar span{padding:7px 9px;color:#bec8bc;font-size:8px;letter-spacing:.1em}.modebar button{border:0;background:transparent;color:#e4e8e2;font-size:8px;padding:7px 10px}.modebar button.on{background:#77857a}
@media(max-width:1100px){header{gap:12px;padding:0 16px}.overview{grid-template-columns:155px 1fr}.overview>.panel:last-of-type{grid-column:1/-1}.two{grid-template-columns:1fr}.frames-layout{grid-template-columns:1fr 260px}.frame-grid{grid-template-columns:repeat(4,1fr)}nav{gap:11px}}
@media(max-width:700px){header{height:auto;padding:10px 12px;flex-wrap:wrap}.junction{border:0;margin-left:auto}nav{order:3;width:100%;height:30px;justify-content:space-around}.topstatus{display:none}main{padding:18px 12px 88px}.title{align-items:flex-start;flex-direction:column}.overview{grid-template-columns:1fr}.overview>.panel:last-of-type{grid-column:auto}.junction-list{display:flex;overflow:auto}.jitem{min-width:90px;border-right:1px solid #e8eae6}.map{height:300px}.two,.rule-grid,.frames-layout{grid-template-columns:1fr}.frame-grid{grid-template-columns:repeat(3,1fr)}.meta{gap:9px;flex-wrap:wrap}.modebar span{display:none}}
</style></head><body><div id="app"></div>
<script>
const L=[
{id:"C1",role:"Auto E-Car",screen:"B4",sensor:"C1 far + near",kind:"auto"},
{id:"C2",role:"Manual",screen:"B1",sensor:"one · near junction",kind:"manual"},
{id:"C3",role:"Manual special",screen:"B2",sensor:"Mini Plus · hand",kind:"special"},
{id:"C4",role:"Manual special",screen:"B5",sensor:"Mini Plus · hand",kind:"special"},
{id:"C5",role:"Manual",screen:"B3",sensor:"one · near junction",kind:"manual"}
];
const F=[
["F01","START","start","เริ่มระบบ · จุดเดิน","เริ่มต้นจอและ firmware"],
["F02","LINK WAIT","start","รอคำสั่ง","Ethernet พร้อม รอ controller"],
["F03","READY","start","พร้อมทำงาน","ได้รับ config ครบแล้ว"],
["F04","RED X","active","X แดง","ไม่มีรถ / ยังไม่ได้สิทธิ์"],
["F05","GREEN ↑","active","ลูกศรเขียว","เลนได้รับสิทธิ์ผ่าน"],
["F06","GO 6","count","ลูกศร + 6","ไฟเขียวหลังยืนยันมือ"],
["F07","GO 5","count","ลูกศร + 5","นับถอยหลัง"],
["F08","GO 4","count","ลูกศร + 4","นับถอยหลัง"],
["F09","GO 3","count","ลูกศร + 3","นับถอยหลัง"],
["F10","GO 2","count","ลูกศร + 2","นับถอยหลัง"],
["F11","GO 1","count","ลูกศร + 1","วินาทีสุดท้าย"],
["F12","SENSE 1/3","hand","เป้า 1/3","เริ่มจับเวลาค้าง"],
["F13","SENSE 2/3","hand","เป้า 2/3","กำลังตรวจพบต่อเนื่อง"],
["F14","SENSE 3/3","hand","เป้า 3/3","ครบเวลาค้าง 3 วินาที"],
["F15","SENSE OK","hand","เป้า + OK","ยืนยันก่อนเปลี่ยนเป็นเขียว"],
["F16","SENSOR n","fault","SENSOR n BROKEN","พักเฉพาะเลนที่ขัดข้อง"],
["F17","LINK LOST","fault","LINK LOST","จอไม่ได้รับคำสั่งเกินกำหนด"],
["F18","LINK OK","fault","LINK OK","แจ้งเมื่อการเชื่อมต่อกลับมา"],
["F19","CTRL OFF","fault","CTRL OFFLINE","controller ไม่ทำงาน"],
["F20","CONFIG ERR","fault","CONFIG ERROR","config ผิดหรือไม่มีจอจับคู่"],
["F21","LANE OFF","fault","LANE OFF","ปิดเลนจาก UI"],
["F22","SENSE 0/3","reserve","เป้าหรี่ 0/3","ปล่อยมือก่อนครบ · สำรอง"],
["F23","REQUEST","reserve","X + เป้าเล็ก","แสดงว่าเลนพิเศษเปิดรับ trigger"],
["F24","YELLOW △","reserve","สามเหลี่ยมเหลือง","เฟรม V1 · ปิดตามค่าเริ่มต้น"],
["F25","GREEN ←","reserve","ลูกศรซ้าย","สำรองสำหรับเลนเลี้ยว"],
["F26","GREEN →","reserve","ลูกศรขวา","สำรองสำหรับเลนเลี้ยว"],
["F27","ALL STOP","reserve","กรอบแดง + X","สำรอง · หยุดทั้งแยก"]
];
let page="overview",selLane="C3",selFrame="F13",category="all",scenario="idle";
function arrow(dir,color){const d={up:"M32 2 10 23h13v8h18v-8h13z",left:"M3 16 26 1v11h29v9H26v11z",right:"M61 16 38 1v11H9v9h29v11z"};return '<path d="'+(d[dir]||d.up)+'" fill="'+color+'"/>'}
function textSvg(t,x,y,size,color){return '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-family="monospace" font-weight="700" font-size="'+size+'" fill="'+color+'">'+t+'</text>'}
function art(id){
 let f=F.find(x=>x[0]===id)||F[3],s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32"><defs><pattern id="px" width="1" height="1" patternUnits="userSpaceOnUse"><circle cx=".5" cy=".5" r=".23" fill="#9ba89e" opacity=".24"/></pattern></defs><rect width="64" height="32" fill="#050706"/>';
 if(id==="F01")s+='<rect x="1" y="1" width="62" height="30" fill="none" stroke="#dc4145" stroke-width="1.5"/>'+textSvg("START",32,17,8,"#fff")+textSvg("• • •",32,27,5,"#fff");
 else if(id==="F02")s+='<rect x="1" y="1" width="62" height="30" fill="none" stroke="#dc4145" stroke-width="1.5"/>'+textSvg("LINK",32,14,8,"#fff")+textSvg("WAIT",32,25,8,"#fff");
 else if(id==="F03")s+=textSvg("READY",32,20,9,"#f1f3ee");
 else if(id==="F04")s+='<path d="M18 4 11 11l17 17 7-7L18 4Zm28 0L28 22l7 7 18-18-7-7Z" fill="#f0444c"/>';
 else if(id==="F05"||(/^F(0[6-9]|1[01])$/.test(id)))s+=arrow("up","#27d579")+(id==="F05"?"":textSvg(id==="F06"?"6":id==="F07"?"5":id==="F08"?"4":id==="F09"?"3":id==="F10"?"2":"1",53,25,19,"#f0f1ec"));
 else if(/^F1[234]$/.test(id)||id==="F15"||id==="F22"||id==="F23"){let n=id==="F12"?"1":id==="F13"?"2":id==="F14"?"3":id==="F22"?"0":"3";let c=id==="F22"?"#60706d":"#14c4d0";s+='<circle cx="18" cy="16" r="3" fill="none" stroke="'+c+'" stroke-width="2"/><circle cx="18" cy="16" r="8" fill="none" stroke="'+c+'" stroke-width="2"/><circle cx="18" cy="16" r="13" fill="none" stroke="'+c+'" stroke-width="2"/>'+textSvg(n+(id==="F15"?" OK":"/3"),47,22,11,id==="F15"?"#fff":c);if(id==="F23")s+='<path d="M8 3 3 8l20 21 5-5zM23 3 8 20l5 7L29 8z" fill="#ed4148"/>'}
 else if(id==="F16")s+='<rect x="1" y="1" width="62" height="30" fill="none" stroke="#df353c" stroke-width="2"/>'+textSvg("SENSOR 1",32,13,6,"#fff")+textSvg("BROKEN",32,24,8,"#fff");
 else if(id==="F17"||id==="F18"||id==="F19"||id==="F20"||id==="F21"||id==="F27"){let label=id==="F17"?"LINK LOST":id==="F18"?"LINK OK":id==="F19"?"CTRL OFFLINE":id==="F20"?"CONFIG ERROR":id==="F21"?"LANE OFF":"ALL STOP";let col=id==="F18"?"#ddd":"#df353c";s+='<rect x="1" y="1" width="62" height="30" fill="none" stroke="'+col+'" stroke-width="2"/>'+(id==="F27"?'<path d="M18 4 11 11l17 17 7-7L18 4Zm28 0L28 22l7 7 18-18-7-7Z" fill="#f0444c"/>':textSvg(label,32,19,6,col));}
 else if(id==="F24")s+='<path d="M32 2 5 30h54z" fill="#eabf2f"/>';
 else if(id==="F25")s+='<path d="M4 16 27 1v11h29v9H27v11z" fill="#27d579"/>';
 else if(id==="F26")s+='<path d="M60 16 37 1v11H8v9h29v11z" fill="#27d579"/>';
 else s+=arrow("up","#27d579");
 s+='<rect width="64" height="32" fill="url(#px)"/></svg>';return s
}
function header(){return '<header><div class="brand">TRAFFIC PLATFORM<small>T3 · แยกพิเศษ</small></div><div class="junction"><b>T3 · จุดตัดข้าง pillar</b>　⌄</div><nav><button data-page="overview" class="'+(page==="overview"?"on":"")+'">ภาพรวมแยก</button><button data-page="mapping" class="'+(page==="mapping"?"on":"")+'">ผังและการจับคู่</button><button data-page="rules" class="'+(page==="rules"?"on":"")+'">พารามิเตอร์และกติกา</button><button data-page="frames" class="'+(page==="frames"?"on":"")+'">เฟรม HUB75</button></nav><div class="topstatus"><span><i class="dot"></i>Controller A · online</span><span>config v1</span></div></header>'}
function title(k,h,sub,buttons){return '<div class="kicker">'+k+'</div><div class="title"><div><h1>'+h+'</h1><p>'+sub+'</p></div><div class="actions">'+(buttons||"")+'</div></div>'}
function meta(){return '<div class="meta"><span>เลน <b>5</b></span><span>เซนเซอร์ <b>6 จุด</b></span><span>จอ <b>5 จอ</b></span><span>เมื่อไม่มีรถ <b class="idle">X แดงทุกจอ</b></span></div>'}
function laneState(id){if(scenario==="fault"&&id==="C3")return ["SENSOR BROKEN","fault"];if(scenario==="auto"&&id==="C1")return ["ได้สิทธิ์ · เขียว","green"];if(scenario==="manual"&&id==="C2")return ["ได้สิทธิ์ · เขียว","green"];if(scenario==="hand"&&id==="C3")return ["ตรวจมือ · 2/3","blue"];if(scenario==="cross"&&id==="C2")return ["รถอยู่ในแยก","blue"];if(scenario==="cross"&&id==="C1")return ["รอแยกว่าง","muted"];return ["ไม่มีรถ · X แดง","red"]}
function screenFor(id){if(scenario==="fault"&&id==="C3")return "F16";if(scenario==="auto"&&id==="C1")return "F05";if(scenario==="manual"&&id==="C2")return "F05";if(scenario==="hand"&&id==="C3")return "F13";if(scenario==="cross"&&id==="C2")return "F05";return "F04"}
function miniScreen(id){return '<div class="screen">'+art(id)+'</div>'}
function laneTable(){return '<section class="panel"><div class="ph"><b>สถานะเลนและจอ</b><span>ตัวอย่างการทำงาน</span></div><table class="status-table"><thead><tr><th>เลน</th><th>sensor / สถานะ</th><th>จอ</th><th>เฟรมตอนนี้</th></tr></thead><tbody>'+L.map(l=>{let st=laneState(l.id);return '<tr><td class="sid">'+l.id+'<br><span class="muted">'+l.role+'</span></td><td><span class="muted">'+l.sensor+'</span><br><span class="st'+(st[1]==="green"?"green":st[1]==="red"||st[1]==="fault"?"red":st[1]==="blue"?"blue":"")+'">'+st[0]+'</span></td><td class="sid">'+l.screen+'</td><td>'+miniScreen(screenFor(l.id))+'</td></tr>'}).join("")+'</tbody></table></section>'}
function mapArt(){return '<div class="map"><div class="road"></div>'+L.map((l,i)=>'<div class="lane '+(l.kind==="manual"?"manual":l.kind==="special"?"special":"")+' '+["ln1","ln2","ln3","ln4","ln5"][i]+' '+(selLane===l.id?"sel":"")+'" data-lane="'+l.id+'"><i>↑</i><b>'+l.id+' · '+(l.kind==="auto"?"AUTO":l.kind==="special"?"HAND":"MANUAL")+'</b><small>จอ '+l.screen+'</small></div>').join("")+'<i class="sdot sd1"></i><i class="sdot sd1b"></i><i class="sdot sd2"></i><i class="sdot sd3"></i><i class="sdot sd4"></i><i class="sdot sd5"></i><span class="pillar">PILLAR</span><span class="boxa">A · Main box</span></div>'}
function scenarioButtons(){const xs=[["idle","ไม่มีรถ"],["manual","Manual C2"],["cross","Manual อยู่ในแยก + Auto มา"],["auto","Auto ได้ผ่าน"],["hand","ตรวจมือ C3"],["fault","Sensor C3 เสีย"]];return '<div class="sim"><div class="simhead"><b>จำลองสถานการณ์</b><span>preview เท่านั้น · ไม่ส่งคำสั่งไปจอจริง</span></div><div class="scenarios">'+xs.map(x=>'<button data-scenario="'+x[0]+'" class="'+(scenario===x[0]?"active":"")+'">'+x[1]+'</button>').join("")+'</div></div>'}
function overview(){return title("1 · ภาพรวม","T3 · สถานะทางแยก","ผังจริง, เลนที่ได้สิทธิ์ และเฟรมตัวอย่างบนจอ B1–B5",'<button class="btn">ดูผังเต็ม</button><button class="btn dark">บันทึก config</button>')+meta()+'<div class="overview"><section class="panel"><div class="ph"><b>รายการแยก</b><span>1 จุด</span></div><div class="junction-list"><div class="jitem"><b>Normal V1</b><small>ต้นแบบ · ปกติ</small></div><div class="jitem active"><b>T3 · Special</b><small>5 เลน · ใช้งาน</small></div><div class="jitem"><b>＋ เพิ่มแยก</b><small>ใช้ชุด controller เดียวกัน</small></div></div></section><section class="panel"><div class="ph"><b>ผังแยก T3</b><span>กล่อง A · ข้าง pillar</span></div>'+mapArt()+'<div class="mapfoot"><span><i style="background:#16895b"></i>Auto</span><span><i style="background:#477aa7"></i>Manual</span><span><i style="background:#b68b38"></i>Manual พิเศษ</span></div></section>'+laneTable()+'</div>'+scenarioButtons()}
function editor(){let l=L.find(x=>x.id===selLane)||L[2];return '<section class="panel"><div class="ph"><b>'+l.id+' · '+l.role+'</b><span>รายละเอียดเลน</span></div><div class="editor"><p>กำหนดประเภทเลน, sensor และจอที่สัมพันธ์กัน</p><div class="field"><label>ชื่อที่แสดง</label><input value="'+l.id+' · '+l.role+'"></div><div class="field"><label>ประเภท</label><select><option>'+l.role+'</option></select></div><div class="field-grid"><div class="field"><label>จอ</label><select><option>'+l.screen+'</option></select></div><div class="field"><label>ทิศทาง</label><select><option>↑ ขึ้น</option><option>← ซ้าย</option><option>→ ขวา</option></select></div></div><div class="field"><label>Sensor mapping</label><input value="'+l.sensor+'"></div><div class="notice">จอของเลนนี้: '+l.screen+' · เมื่อ sensor ของ '+l.id+' เสีย ให้พักเฉพาะเลนนี้และแสดง SENSOR n BROKEN</div></div></section>'}
function mapping(){return title("2 · ผังและการจับคู่","เลน · sensor · จอ","ตรวจสอบการจับคู่กับภาพผัง T3 และเลือกเลนเพื่อแก้ไข",'<button class="btn">ยกเลิก</button><button class="btn dark">บันทึกการจับคู่</button>')+meta()+'<div class="two"><section class="panel"><div class="ph"><b>ผังตำแหน่งอุปกรณ์</b><span>สเก็ตช์อ้างอิง ไม่ใช่สเกล</span></div>'+mapArt()+'<div class="mapfoot">Sensor dots: C1 far/near · C2 vehicle · C3/C4 hand · C5 vehicle</div></section><div><section class="panel"><div class="ph"><b>ตารางจับคู่</b><span>เลือกแถวเพื่อแก้ไข</span></div><table class="mapping"><thead><tr><th>เลน</th><th>ประเภท</th><th>Sensor</th><th>จอ</th></tr></thead><tbody>'+L.map(l=>'<tr class="'+(selLane===l.id?"sel":"")+'" data-lane="'+l.id+'"><td>'+l.id+'</td><td>'+l.role+'</td><td>'+l.sensor+'</td><td>'+l.screen+'</td></tr>').join("")+'</tbody></table></section><div style="margin-top:12px">'+editor()+'</div></div></div>'}
function rules(){return title("3 · พารามิเตอร์และกติกา","ตั้งค่าการทำงาน","ค่าเริ่มต้นเป็นค่าทดลอง ปรับได้แยกราย junction",'<button class="btn">คืนค่าเดิม</button><button class="btn dark">บันทึก config</button>')+meta()+'<div class="rule-grid"><section class="rule-group"><h2>เวลาและการตรวจจับ</h2><div class="rule"><div><b>Manual clear delay</b><small>เริ่มจับหลังท้ายรถ/dolly พ้น sensor</small></div><input value="3 วินาที"></div><div class="rule"><div><b>Auto clear delay</b><small>หลังท้าย dolly พ้น sensor ใกล้แยก</small></div><input value="4 วินาที"></div><div class="rule"><div><b>Hand hold</b><small>C3/C4 ต้องตรวจพบต่อเนื่องก่อนยืนยัน</small></div><input value="3 วินาที"></div><div class="rule"><div><b>Special green</b><small>ไฟเขียวหลังยืนยัน trigger</small></div><input value="6 วินาที"></div></section><section class="rule-group"><h2>กติกาเลนและสถานะจอ</h2><div class="rule"><div><b>Auto C1 priority</b><small>ขอสิทธิ์ก่อนเมื่อทางแยกว่าง</small></div><select><option>เปิด</option></select></div><div class="rule"><div><b>จอเมื่อไม่มีรถ</b><small>สถานะ idle ของทุกเลน</small></div><select><option>F04 · X แดง</option></select></div><div class="rule"><div><b>Sensor fault</b><small>ระบุ sensor และปิดเฉพาะเลนนั้น</small></div><select><option>Lane only · F16</option></select></div><div class="rule"><div><b>Yellow triangle</b><small>สำรองจาก V1 · ไม่ใช้ใน flow ปกติ</small></div><select><option>ปิด · reserve F24</option></select></div></section></div><div class="rules-note">การแก้ค่าจะบันทึกใน config ของแยกนั้น ส่วนโปรแกรม controller ใช้ร่วมกันทุกแยก</div>'}
function frameCard(f){return '<div class="fc '+(selFrame===f[0]?"sel":"")+'" data-frame="'+f[0]+'">'+mini(f[0])+'<div class="lab"><b>'+f[0]+' · '+f[2]+'</b><small class="'+(f[2]==="สำรอง"?"reserved":"onstate")+'">'+(f[2]==="สำรอง"?"สำรอง":"ใช้งาน")+'</small></div></div>'}
function mini(id){return '<div class="screen">'+art(id)+'</div>'}
function frames(){let selected=F.find(f=>f[0]===selFrame)||F[12],list=F.filter(f=>category==="all"||(category==="reserve"?f[2]==="reserve":f[2]===category));return title("4 · เฟรมจอ HUB75","คลังเฟรม · 27 แบบ","วาดตามพิกเซล 64×32 · เก็บใน ESP32 · เลือกเฟรมเพื่อดูรายละเอียด",'<button class="btn">ดาวน์โหลด catalog</button><button class="btn dark">บันทึกชุดเฟรม</button>')+'<div class="frames-layout"><section><div class="frame-tabs">'+[['all','ทั้งหมด 27'],['active','ใช้งาน 21'],['reserve','สำรอง 6']].map(x=>'<button data-category="'+x[0]+'" class="'+(category===x[0]?"on":"")+'">'+x[1]+'</button>').join("")+'</div><div style="height:9px"></div><div class="frame-grid">'+list.map(frameCard).join("")+'</div></section><aside class="panel"><div class="ph"><b>ตัวอย่างขนาดจริง</b><span>64 × 32 px</span></div><div class="large-screen"><div class="screen">'+art(selected[0])+'</div><h2>'+selected[0]+' · '+selected[3]+'</h2><p>'+selected[4]+'</p><div class="details">สถานะ: <span class="'+(selected[2]==="reserve"?"reserved":"onstate")+'">'+(selected[2]==="reserve"?"สำรอง":"ใช้งาน")+'</span><br>ใช้กับ: '+((selected[0]==="F12"||selected[0]==="F13"||selected[0]==="F14"||selected[0]==="F15")?"C3 / C4":selected[0]==="F16"?"เฉพาะเลน sensor fault":"ทุกเลนที่ตรงสถานะ")+'<br>พื้นหลัง: ดำ · สีตามสถานะ</div><div class="measure"><span>จำลองจอ</span><span>ใกล้ · 15 m · 30 m</span></div><div class="notice">สามเหลี่ยมเหลือง F24 ปิดไว้เป็นค่าเริ่มต้น</div></div></aside></div>'}
function bind(){document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll("[data-lane]").forEach(b=>b.onclick=()=>{selLane=b.dataset.lane;render()});document.querySelectorAll("[data-scenario]").forEach(b=>b.onclick=()=>{scenario=b.dataset.scenario;render()});document.querySelectorAll("[data-frame]").forEach(b=>b.onclick=()=>{selFrame=b.dataset.frame;render()});document.querySelectorAll("[data-category]").forEach(b=>b.onclick=()=>{category=b.dataset.category;render()})}
function render(){document.getElementById("app").innerHTML=header()+'<main>'+((page==="mapping")?mapping():(page==="rules")?rules():(page==="frames")?frames():overview())+'</main><div class="modebar"><span>GPT DESIGN REVIEW</span><button class="'+(page==="overview"?"on":"")+'" data-page="overview">ภาพรวม</button><button class="'+(page==="mapping"?"on":"")+'" data-page="mapping">Mapping</button><button class="'+(page==="rules"?"on":"")+'" data-page="rules">Rules</button><button class="'+(page==="frames"?"on":"")+'" data-page="frames">Frames</button></div>';bind()}
render();
</script></body></html>

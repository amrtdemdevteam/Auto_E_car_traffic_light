; T3 display firmware (docs/T3_DESIGN.md). V1 firmware stays in ../esp32_display.
;
; Build:          pio run -e t3_display3
; First flash:    pio run -e t3_display3 -t upload      (USB, once per display)
; Later updates:  upload .pio/build/t3_display3/firmware.bin from the Pi web UI (OTA)
;
; OTA_PASSWORD must match "ota.password" in /etc/trafficlight/settings.json.
; Change it here and there before deployment.

[platformio]
default_envs = t3_display1

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; default.csv = two OTA app slots (~1.25 MB each), needed for OTA + rollback
board_build.partitions = default.csv
lib_ldf_mode = deep+
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.10
    adafruit/Adafruit GFX Library
    knolleary/PubSubClient@^2.8
    arduino-libraries/Ethernet@^2.0.2
    bblanchon/ArduinoJson@^7.0.4
; EthOTA is vendored in lib/EthOTA (do not add jandrassy/ArduinoOTA: its name
; clashes with the ESP32 core's WiFi-only ArduinoOTA library)
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DT3_JUNCTION_ID=\"T3\"
    -DOTA_PASSWORD=\"change-me\"
    -DFIRMWARE_VERSION=\"t3-1.0.0\"

[env:t3_display1]
build_flags =
    ${env.build_flags}
    -DDISPLAY_ID=1

[env:t3_display2]
build_flags =
    ${env.build_flags}
    -DDISPLAY_ID=2

[env:t3_display3]
build_flags =
    ${env.build_flags}
    -DDISPLAY_ID=3

[env:t3_display4]
build_flags =
    ${env.build_flags}
    -DDISPLAY_ID=4

[env:t3_display5]
build_flags =
    ${env.build_flags}
    -DDISPLAY_ID=5
